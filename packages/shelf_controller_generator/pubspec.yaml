name: shelf_controller_generator
description: build_runner builders generating shelf routers and an OpenAPI 3.1 spec from typed shelf controllers.
version: 1.0.0
repository: https://github.com/fnx-io/shelf_controller/tree/master/packages/shelf_controller_generator
issue_tracker: https://github.com/fnx-io/shelf_controller/issues
topics:
  - shelf
  - openapi
  - server
  - code-generation
environment:
  sdk: ^3.11.0
resolution: workspace
dependencies:
  analyzer: ^14.4.0
  build: ^4.0.11
  dart_style: ^3.1.13
  glob: ^2.2.0
  source_gen: ^4.3.0
  yaml: ^3.1.4
dev_dependencies:
  build_runner: ^2.16.1
  build_test: ^3.5.20
  json_annotation: ^4.12.0
  lints: ^6.1.0
  logging: ^1.3.0
  path: ^1.9.1
  shelf_controller:
    path: ../shelf_controller
  test: ^1.32.0
