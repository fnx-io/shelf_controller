targets:
  $default:
    builders:
      json_serializable:
        options:
          # Read by shelf_controller_generator too, so the spec uses
          # `created_at` exactly like the generated toJson.
          field_rename: snake
      shelf_controller_generator:
        options:
          output: openapi.yaml
          info:
            title: Projects API
            version: 1.0.0
            description: Example API generated by shelf_controller.
          servers:
            - url: http://localhost:8080
          securitySchemes:
            bearer: { type: http, scheme: bearer }
          security: [ { bearer: [] } ]
