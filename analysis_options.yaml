include: package:lints/recommended.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "packages/shelf_controller_generator/test/goldens/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
